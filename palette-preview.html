<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>见微 · Parchment / Indigo 配色预览</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5e9d3}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe title="见微配色预览" src="index.html"></iframe>
  <script>
    const frame = document.querySelector('iframe');
    frame.addEventListener('load', () => {
      const link = frame.contentDocument.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'palette-preview.css';
      frame.contentDocument.head.appendChild(link);
    });
  </script>
</body>
</html>
